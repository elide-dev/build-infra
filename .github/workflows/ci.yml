name: Shared actions and binstat
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: pnpm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run type-check
      - run: bun test services
      - run: node --test actions/*/*.test.cjs
      - run: pnpm --dir services/client run build
      - run: node services/client/dist/client/client.mjs binstats --help && node services/client/dist/client/client.mjs bincompare --help
