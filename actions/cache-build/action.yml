name: Cache build inputs and outputs
description: Cache Bun downloads and content-addressed Turbo results after toolchain setup.
inputs:
  scope:
    required: true
    description: Job-specific cache namespace
runs:
  using: composite
  steps:
    - name: Identify toolchain
      id: versions
      shell: bash
      run: |
        echo "bun=$(bun --version)" >> "$GITHUB_OUTPUT"
        echo "node=$(node --version)" >> "$GITHUB_OUTPUT"
    - name: Cache Bun downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.versions.outputs.bun }}-downloads-${{ hashFiles('bun.lock') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.versions.outputs.bun }}-downloads-
    - name: Cache Turbo results
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .turbo/cache
        key: ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.versions.outputs.bun }}-node-${{ steps.versions.outputs.node }}-turbo-v1-${{ inputs.scope }}-${{ hashFiles('bun.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.versions.outputs.bun }}-node-${{ steps.versions.outputs.node }}-turbo-v1-${{ inputs.scope }}-${{ hashFiles('bun.lock') }}-
          ${{ runner.os }}-${{ runner.arch }}-bun-${{ steps.versions.outputs.bun }}-node-${{ steps.versions.outputs.node }}-turbo-v1-${{ inputs.scope }}-
