name: Run Renovate
description: Update dependencies in the calling repository with a job or installation token.
inputs:
  token:
    description: Short-lived GitHub token with permission to update this repository
    required: false
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
      env:
        RENOVATE_REPOSITORIES: ${{ github.repository }}
      with:
        token: ${{ inputs.token }}
        mount-docker-socket: 'false'
